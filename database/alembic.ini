# Alembic configuration for CineROI AI database migrations.
[alembic]
script_location = migrations
prepend_sys_path = .
# Database URL is supplied at runtime from the backend settings / environment
# (CINEROI_DATABASE_URL). The placeholder below is overridden in env.py.
sqlalchemy.url = postgresql+psycopg://cineroi:cineroi@localhost:5432/cineroi

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
