name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: unit + property + integration tests against a real pgvector DB.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend tests (pytest + hypothesis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cineroi
          POSTGRES_PASSWORD: cineroi
          POSTGRES_DB: cineroi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cineroi -d cineroi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Point the integration tests at the service container so they run
      # (rather than skip). The conftest runs the Alembic migrations itself.
      CINEROI_DATABASE_URL: postgresql+psycopg://cineroi:cineroi@localhost:5432/cineroi
      CINEROI_BROKER_URL: redis://localhost:6379/0
      CINEROI_RESULT_BACKEND_URL: redis://localhost:6379/1
      CINEROI_ENCRYPTION_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend (with dev extras)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        working-directory: backend
        run: pytest -q

  # ---------------------------------------------------------------------------
  # Frontend: lint, typecheck, and component tests.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint + typecheck + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm run test

  # ---------------------------------------------------------------------------
  # Deployment smoke test: build the full stack and prove it comes up healthy.
  # ---------------------------------------------------------------------------
  smoke:
    name: Docker deployment smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 420
      - name: Verify /health reports all components up
        run: |
          set -e
          for i in $(seq 1 10); do
            body=$(curl -fsS http://localhost:8000/health || true)
            echo "$body"
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "Stack is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Health never reached ok" >&2
          docker compose logs --tail 50
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v