[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cineroi-backend"
version = "0.1.0"
description = "CineROI AI backend - FastAPI decision-support platform for OTT content acquisition"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # Web framework (async ASGI)
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9",
    # Settings & validation
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    # ORM (async) + migrations
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    # PostgreSQL async driver + pgvector
    "psycopg[binary,pool]>=3.1,<4.0",
    "pgvector>=0.3,<1.0",
    # Async task queue + broker client
    "celery>=5.4,<6.0",
    "redis>=5.0,<6.0",
    # Document parsing (CSV/JSON/PDF ingestion)
    "pypdf>=4.2,<5.0",
    # Security stubs (JWT/session, password hashing)
    "pyjwt>=2.8,<3.0",
    "passlib[bcrypt]>=1.7,<2.0",
    # Encryption at rest (Fernet column encryption for scripts/deal-terms/PII)
    "cryptography>=42.0,<44.0",
    # HTTP client for telemetry connectors
    "httpx>=0.27,<1.0",
    # Structured logging
    "structlog>=24.1,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<8.0",
    "hypothesis>=6.100,<7.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    # Ephemeral PostgreSQL 16 + pgvector for schema-integrity integration tests
    # (task 2.4). Falls back to a CINEROI_DATABASE_URL / TEST_DATABASE_URL
    # connection, and skips cleanly when neither Docker nor a DB is reachable.
    "testcontainers[postgres]>=4.0,<5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra"
markers = [
    "integration: tests that require a real PostgreSQL 16 + pgvector instance (Docker via testcontainers or an externally provided database). Skipped cleanly when neither is available.",
    "slow: slow, opt-in end-to-end tests (e.g. the deployment smoke test that brings the full docker compose stack up). Skipped cleanly when Docker is unavailable.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/**/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
]
