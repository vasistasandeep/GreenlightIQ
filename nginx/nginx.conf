# =============================================================================
# CineROI AI - production reverse proxy (TLS termination + routing)
# =============================================================================
# Terminates HTTPS, forwards /api and /health to the backend and everything
# else to the Next.js frontend. Security headers are applied centrally here.
# Drop real certs at nginx/certs/fullchain.pem and nginx/certs/privkey.pem
# (or mount from your cert manager / Let's Encrypt).
# =============================================================================

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 25m;   # ingestion batches

  upstream backend  { server backend:8000; }
  upstream frontend { server frontend:3000; }

  # Redirect all plain HTTP to HTTPS.
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API + health -> backend.
    location /api/   { proxy_pass http://backend; include /etc/nginx/proxy_common.conf; }
    location /health { proxy_pass http://backend; include /etc/nginx/proxy_common.conf; }

    # Everything else -> Next.js frontend.
    location / { proxy_pass http://frontend; include /etc/nginx/proxy_common.conf; }
  }
}